# The users database: sign-in and user attributes. anfra and your data stay where they are.
services:
  users-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: anfra_user
      POSTGRES_PASSWORD: anfra_user
      POSTGRES_DB: anfra_user
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - users-db:/var/lib/postgresql/data
volumes:
  users-db:
